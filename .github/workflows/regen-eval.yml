# Regeneration Eval Workflow — Plan 7 Phase E
# spec §5.1:weekly + PR(若改 regenerator.ts / quality-judge.ts) + 手动
# ANTHROPIC_API_KEY 通过 GitHub Secrets 注入(缺失时优雅 skip,同 skill-eval.yml 模式)

name: regen-eval

on:
  pull_request:
    paths:
      - 'src/core/legacy-bridge/regenerator.ts'
      - 'src/core/legacy-bridge/quality-judge.ts'
      - 'forge-eval/regeneration-runner.ts'
      - 'forge-eval/regeneration-types.ts'
      - 'forge-eval/regeneration-scenarios/**'
  schedule:
    - cron: '0 8 * * 0' # 周日 UTC 8am(同 skill-eval cadence)
  workflow_dispatch:
    inputs:
      scenario:
        description: '单 scenario id(可选,默认全跑)'
        required: false
        type: string

jobs:
  regen-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # secret 缺失时优雅 skip(避免 PR 误报红 X);加 secret 后本 workflow 自动起跑
      - name: Check ANTHROPIC_API_KEY secret
        id: check_secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret 未配置,regen-eval 跳过。在 repo Settings → Secrets and variables → Actions 添加后,本 workflow 会自动开始跑。详见 docs/legacy-bridge.md"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.has_key == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.check_secret.outputs.has_key == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.check_secret.outputs.has_key == 'true'
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: pnpm install
        if: steps.check_secret.outputs.has_key == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run regen-eval
        if: steps.check_secret.outputs.has_key == 'true'
        run: |
          if [ -n "${{ inputs.scenario }}" ]; then
            pnpm eval-regen:scenario --scenario "${{ inputs.scenario }}"
          else
            pnpm eval-regen
          fi

      - name: Upload report
        if: always() && steps.check_secret.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regen-report
          path: forge-eval/regen-report.md
          if-no-files-found: warn
