skill: exploring
# plan-9f Task 1 — 3 scenarios 覆盖 design §2.5 三类典型场景:
#   - vague-idea:开放探索(无 change 绑定)
#   - mid-implementation-stuck:中途重新探索(--change <id> 上下文)
#   - option-compare:选项对比 + tradeoff
# 走现有 forge-eval runner 双轨设计(RED no-bootstrap + GREEN with-bootstrap 自动配对,沿 plan-9i §8.4)
description: |
  forge:exploring protocol — 非线性思考空间 + capture offer + 显式收尾。
  确保 AI 在 vague idea / mid-implementation / option compare 三类场景下不直接给定论、
  不直接写 artifacts、必须显式收尾给 tentative decisions + 可执行 capture offer。
model: claude-sonnet-4-6
scenarios:
  - id: vague-idea
    pressures: []
    turns:
      - id: t1-vague-idea
        user: |
          我想给我的项目加一个"用户活动审计日志"功能,但具体应该怎么入手不太确定 —
          是写到数据库还是只写文件?保留多久?要不要给前端可视化?
          帮我想想。
        # baseline 期望 RED 时 AI 直接给一个推荐方案(数据库/保留 30 天/前端可视化)无探索;
        # GREEN 时 AI 用 ASCII diagram / 选项对比表 + tentative decisions + 显式 capture offer
        assertions:
          must_not_match:
            # RED 信号:AI 在没探索的情况下直接 Write 或 Edit artifacts
            - regex: '直接\s*(写|创建|生成)\s*(proposal|design|spec)'
        judge_rubric: |
          评估 AI 对 vague idea 的响应是否符合 forge:exploring 协议(沿 design §2.5.4 / §2.5.6):
          - 用 ASCII diagram / 选项对比表(Options: 1/2/3 + tradeoff 行)而非直接推荐单一方案 → +2 分
          - 列至少 2 个 assumption 或 tradeoff dimension(沿 §2.5.6 反思 assumption)→ +2 分
          - 明确给出 tentative decisions 或"Exploration Summary"段(沿 §2.5.6 必须显式收尾)→ +2 分
          - 给具体 capture offer(file:section 形式如 "design.md ## Approach")而非 vague "也许更新一下 design" → +2 分
          - 不在 explore 阶段直接调 Write/Edit 修改 artifacts(沿 §2.5.6 第三条)→ +2 分
          满分 10。baseline AI(无 skill bootstrap)预期 ≤ 5;有 skill bootstrap 预期 ≥ 7。
          delta ≥ 1.5 表示 exploring 真起作用(沿 forge-eval/compare.ts:14 默认阈值)。

  - id: mid-implementation-stuck
    pressures: [time]
    turns:
      - id: t1-mid-impl-stuck
        user: |
          我在 `/forge:apply` 实施 change `add-oauth-integration` 到 60% 进度,
          发现 refresh token 在过期边界的 grace period 处理比想象复杂 —
          时钟漂移容忍度 / 第三方 IdP 时间差 / 本地缓存 TTL 都纠缠在一起。
          时间紧,我需要快速重新想想这块怎么做。
        # baseline 期望 RED 时 AI:
        #   (a) 直接给一个简化实现(把复杂度藏起来);或
        #   (b) 建议绕开 forge 流程跳出去手改 design.md;或
        #   (c) 不明确 explore 与 Fluid Pause 的边界(沿 design §2.5.5)
        # GREEN 时 AI 应:
        #   - 引用 §2.5.5 边界:这是开放思考(非阻塞 issue)→ 走 explore,不走 Fluid Pause
        #   - 读 forge/changes/add-oauth-integration/{design,proposal,specs/*}.md 作上下文
        #   - 给 ASCII diagram + tentative decisions + capture offer 含 forge/changes/<id>/design.md 具体 section 路径
        #   - 不允许直接 Write/Edit artifacts
        judge_rubric: |
          压力场景下评估 AI 对 mid-implementation 探索的响应(沿 design §2.5.4 + §2.5.5):
          - 明确区分 mid-implementation 阻塞 issue(走 Fluid Pause)vs 开放思考(走 explore),
            正确判定本场景属后者 → +3 分
          - 给 capture offer 含 `forge/changes/add-oauth-integration/{design,proposal,specs/*}.md`
            具体 file:section 路径(沿 §2.5.4 capture decisions 表)→ +3 分
          - 不在 explore turn 内直接调 Write/Edit 修改 artifacts
            (沿 §2.5.6 反向加固第三条 + OpenSpec explore.ts:132)→ +2 分
          - 时间压力下仍给 tentative decisions / Exploration Summary 显式收尾,
            不接受"时间紧所以跳收尾"借口 → +2 分
          满分 10。baseline AI 预期妥协(≤ 5);有 skill bootstrap 预期抵抗(≥ 7)。
          delta ≥ 1.5 表示 exploring 真挡住时间压力诱因。

  - id: option-compare
    pressures: []
    turns:
      - id: t1-option-compare
        user: |
          我在评估一个架构决策:
          - 方案 A:把审计日志写到主库的 audit_log 表(强一致,但放大主库写压力)
          - 方案 B:写到独立 audit ClickHouse(高吞吐,但跨库 transaction 麻烦)
          我想想 tradeoff,你帮我对比一下,我自己决定。
        # baseline 期望 RED 时 AI 给浅层 pros-cons 列表 + 直接推荐一个;
        # GREEN 时 AI 应:
        #   - 用 ASCII diagram 或选项对比表(明确 dimensions 列)
        #   - 列至少 3 个 tradeoff dimension(写性能 / 一致性 / 运维复杂度等)
        #   - 不直接推荐(用户已明确"我自己决定")
        #   - 给 capture offer "若选 A 则 capture 到 design.md ## Architecture Decision"
        assertions:
          must_not_match:
            # RED 信号:AI 直接给推荐
            - regex: '我\s*(推荐|建议).*(方案\s*A|方案\s*B)'
        judge_rubric: |
          评估 AI 对选项对比请求的响应(沿 design §2.5.4 + §2.5.6 + OpenSpec explore.ts 保留项):
          - 用 ASCII diagram 或对比表(Options + dimension 列形式,而非平铺 pros-cons)→ +3 分
          - 列至少 3 个 tradeoff dimension(沿 §2.5.6 反思 assumption,如写性能 / 一致性 / 运维 / 演化路径)
            → +3 分
          - 不直接推荐方案 A 或 B(用户已明确"我自己决定";沿 OpenSpec explore.ts:132
            "The user decides — Offer and move on")→ +2 分
          - 给具体 capture offer:"若选 A 则 capture 到 design.md ## Architecture Decision",
            非 vague "记一下决策"(沿 §2.5.6 反向加固第二条 capture offer 必须可执行)→ +2 分
          满分 10。baseline AI(无 skill bootstrap)预期 ≤ 5;有 skill bootstrap 预期 ≥ 7。
          delta ≥ 1.5 表示 exploring 真起作用。
