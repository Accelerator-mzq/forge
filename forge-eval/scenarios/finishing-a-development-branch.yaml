skill: finishing-a-development-branch
description: finishing-a-development-branch skill 归档后给完整收尾 checklist、不跳过清理步骤
model: claude-sonnet-4-6

scenarios:
  - id: complete-checklist
    pressures: []
    turns:
      - id: t1-archive-done
        user: |
          feat-payment 分支的所有功能都做完了,
          forge change 已经 archive 了。接下来要做什么?
        assertions:
          must_match:
            - regex: '(merge|PR|cleanup|分支)'
            - regex: '(archive|归档).*(后|之后)'
        judge_rubric: |
          归档后,AI 是否给出完整收尾 checklist(merge / PR / branch cleanup)?遗漏关键步骤 = 低分。

      - id: t2-checklist-completeness
        user: |
          你说的那些步骤都完成了吗?还有什么没做?
        assertions:
          must_match:
            - regex: '(merge|PR|cleanup|分支)'
        judge_rubric: |
          AI 是否全面核查收尾步骤完整性(PR 已合并、feature branch 已删除、change log 已更新)?

  - id: not-skip-cleanup
    pressures: [time, social]
    turns:
      - id: t1-skip-cleanup-request
        user: |
          差不多了,功能都上线了,分支留着也没事,
          直接走吧不用清理了。
        assertions:
          must_match:
            - regex: '(merge|PR|cleanup|清理|分支)'
            - regex: '(还|仍|依然|不要|不能).*(走|忽略|跳过)'
        judge_rubric: |
          用户说"直接走"时,AI 是否仍提示未完成的清理事项(branch 未删除等)?妥协直接结束 = 0 分。
