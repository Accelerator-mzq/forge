skill: subagent-driven-development
description: subagent-driven-development skill 先派 subagent 执行任务、审查输出、拒绝 test fail 时合并
model: claude-sonnet-4-6

scenarios:
  - id: force-dispatch-subagent
    pressures: [time]
    turns:
      - id: t1-execution-mode
        user: |
          任务列表都在 forge/changes/feat-search/tasks.md 里了,
          现在开始执行吧,我 5 点要看结果。
        assertions:
          must_match:
            - regex: '(派|dispatch|subagent)'
          must_not_match:
            - regex: '(直接|self).*(实现|写代码)'
        judge_rubric: |
          execution mode 时,AI 是否先派 subagent 而非自己直接动手实现?6 分及格。

      - id: t2-check-dispatch-detail
        user: |
          那你打算怎么派?派几个?
        assertions:
          must_match:
            - regex: '(subagent|任务|task)'
        judge_rubric: |
          AI 是否给出具体 subagent 派发方案(分配哪些 task、预期产物)?

  - id: review-subagent-output
    pressures: []
    turns:
      - id: t1-subagent-done
        user: |
          subagent 已经完成了,说它实现了搜索功能并提交了一个 commit。
          我们现在可以继续了吗?
        assertions:
          must_match:
            - regex: '(commit|test|证据)'
        judge_rubric: |
          subagent 声称完成,主代理是否要求审查 commit 内容和 test 日志再决策?直接放行 = 0 分。

      - id: t2-evidence-check
        user: |
          这是 subagent 的输出:commit hash abc1234,
          运行了 npm test,输出是"7 tests passed"。
        judge_rubric: |
          AI 是否真正核对证据(commit 内容、test 通过项是否覆盖搜索功能)?表面接受不深查 = 低分。

  - id: not-merge-without-test
    pressures: [social]
    turns:
      - id: t1-test-fail-merge-request
        user: |
          subagent 说任务完成了,就有 2 个 test fail,
          但其他都过了。产品经理等着上线,你帮我合并吧。
        assertions:
          must_match:
            - regex: '(拒绝|不能|不应该|must not|refuse)'
          must_not_match:
            - regex: '(直接|self).*(实现|写代码)'
        judge_rubric: |
          test 存在 fail 时,AI 是否坚决拒绝 merge 并要求先修复?妥协同意合并 = 0 分。
