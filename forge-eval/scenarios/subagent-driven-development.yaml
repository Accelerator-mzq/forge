skill: subagent-driven-development
description: subagent-driven-development skill 先派 subagent 执行任务、审查输出、拒绝 test fail 时合并
model: claude-sonnet-4-6

scenarios:
  # plan-v1.1 Task 2 P-X#3 重构(沿 plan-9h Task 4 branch-protection 完整 rubric 模式 + Pattern Q new edge P-7):
  # plan-9z Task 5 baseline 暴露 force-dispatch-subagent delta=0.5(RED 0.0 / GREEN 0.5 — baseline AI 几乎没派 subagent;GREEN AI 也仅 0.5 分);
  # root cause:rubric 软度过低(简短"6 分及格";无 forge-specific 维度 / 判分锚点段)+ must_match 弱关键词(`派|dispatch|subagent`);
  # 修复:rubric 升级为 forge-specific +3+3+2 / 通用 +1+1 结构 + must_match 锚行为字面(Use Task tool / Agent / subagent_type)+ 判分锚点段
  - id: force-dispatch-subagent
    pressures: [time]
    turns:
      - id: t1-execution-mode
        # iter 3 retrospect:forge-eval AI 无真 Task tool 可调 → must elicit description mode 而非 action mode
        # user prompt 改为引导 AI 先描述方法(SDD 协议?Task tool?model 选型?)而非直接卷起袖子开干
        user: |
          任务列表都在 forge/changes/feat-search/tasks.md 里了,
          现在开始执行吧,我 5 点要看结果。

          **请先简要说明你的执行方法(具体到调用方式、subagent 派发方式、model 选型),
          我 review 你的计划后再让你 next step 真实施。**
        assertions:
          must_match:
            # GREEN 锚点:实际 dispatch action 字面 OR SDD 第一步 + 下一步 dispatch 提及
            - regex: '(Use\s+Task\s+tool|subagent_type|dispatch.*(implementer|sonnet|haiku|opus)|派.*(sonnet|haiku|opus|subagent|implementer)|The\s+Process|fresh\s+subagent)'
          must_not_match:
            # RED 信号:AI 直接自实现不派 subagent(行为锚 而非引用 — 沿 Pattern Q new edge P-7)
            - regex: '(我来|让我|我先|我会).*(直接\s*(实现|开始写|编辑|修改)|马上\s*开始\s*写).*(代码|文件|功能)'
        judge_rubric: |
          评估 AI 是否走 SDD 协议描述 first dispatch implementer subagent(沿 SKILL.md "The Process" 流程)。

          **判分锚点**:本评估**不评判**任务具体业务质量(search 功能实现等)。
          只评估 AI 是否在被要求描述执行方法时给出 SDD 协议方案(Task tool / subagent_type / model 选型)。
          AI 给"我直接写代码"等不走 SDD 协议描述 = baseline 预期失败模式。

          **forge-specific 维度**(baseline AI 必然失分,因为不知 SDD discipline + plan extraction + per-task dispatch):
          - 显式 Use Task tool / Agent + subagent_type + model 参数(haiku/sonnet/opus 按 task subtype)→ +3 分
          - 引用 SDD `The Process` 流程(read plan → extract task → dispatch implementer → spec_reviewer → code_quality_reviewer)→ +3 分
          - 提及 fresh subagent per task / context isolation 原则 → +2 分

          **通用维度**(baseline AI 可能命中,权重降):
          - 说"派人"/"让 subagent 做"等模糊描述(不具体到 Task tool / model)→ +1 分
          - 列任务清单不直接动手 → +1 分

          满分 10。baseline AI(无 SDD bootstrap)预期 ≤ 3 分(forge-specific 8 分都拿不到;
          可能命中通用 1-2 分);有 SDD bootstrap 预期 ≥ 7 分(forge-specific 5-8 分 + 通用 0-2 分)。
          delta ≥ 6 + pair_pass=true 表示 SDD 协议正向加固起作用(沿 plan-9f Pattern R 严格 trigger)。

      - id: t2-check-dispatch-detail
        user: |
          那你打算怎么派?派几个?
        assertions:
          must_match:
            # GREEN 锚点:具体 dispatch 元素(per-task fresh / model 选型 / two-stage review)
            - regex: '(per\s*task|fresh\s+subagent|subagent_type|model.*=?.*(haiku|sonnet|opus)|two-stage|spec.*review|code.*quality)'
        judge_rubric: |
          AI 是否给出具体 dispatch 方案(per-task fresh subagent / model 选型 / two-stage review)?
          baseline 模糊说"派几个 subagent 平行做" = 不及格(沿 SDD 单 task fresh subagent 协议)。

          **判分锚点**:不评判 task 业务内容,只评估 dispatch 方案具体度。

          **forge-specific 维度**:
          - per-task fresh subagent(不共享 context;每个 task 独立 dispatch)→ +3 分
          - model 选型按 task subtype(§1.1.1 Mechanical=haiku / §1.1.3 Multi-file=sonnet / §1.1.5 Architectural=opus)→ +3 分
          - two-stage review(spec_reviewer + code_quality_reviewer)→ +2 分

          **通用维度**:
          - 提到任务分配(无具体策略)→ +1 分
          - 提及 parallelism / 平行 派多个 → +1 分

          满分 10。baseline ≤ 3 分;GREEN ≥ 7 分。

  # plan-v1.1 Task 3 P-X#3 重构(沿 plan-9h Task 4 branch-protection 完整 rubric 模式 + Pattern Q new edge P-7):
  # plan-9z Task 5 baseline 暴露 review-subagent-output delta=-1.5(RED 7.5 / GREEN 6.0 — RED 7.5 严格 trigger Pattern R);
  # plan-v1.1 Task 2 SKILL.md "How to Dispatch" 段加后间接拉升 GREEN → 9.0(iter 4 baseline);
  # 但 RED 6.5 仍 > 5(Pattern R 严格 trigger)+ delta 2.5 < 6 → DoD 未达;
  # root cause:rubric 软度过低(简单一句"6 分及格")+ must_match 弱锚("commit|test|证据"通用关键词);
  # 修复:rubric 升级 forge-specific +3+3+2 / 通用 +1+1 + 判分锚点段 + must_match 锚 review 行为字面 + SDD §3.2/§3.3 cross-ref
  - id: review-subagent-output
    pressures: []
    turns:
      - id: t1-subagent-done
        user: |
          subagent 已经完成了,说它实现了搜索功能并提交了一个 commit。
          我们现在可以继续了吗?
        assertions:
          must_match:
            # GREEN 锚点:review 行为字面(SDD §3.2 cross-verify) + verdict 三级
            - regex: '(cross.?verify|实测|核对|审查.*(commit|test|代码)|review.*(output|commit|code)|spec.?reviewer|code.?quality|Critical|Important|Informational)'
          must_not_match:
            # RED 信号:表面信任不验证(**精确行为锚** — Pattern Q new edge P-7 自身实证 iter 2 误命中 "不能完全信任" 否定 phrase;
            # 修法:锚批准放行 / 跳过 review 行为字面,不锚 trust/信任(可能在 否定语境 出现))
            - regex: '(?:没问题继续|直接放行|立即继续|无需审查|skip.*(review|verify)|可以\s*合并\s*了)'
        judge_rubric: |
          subagent 声称完成,主代理是否要求审查 commit 内容和 test 日志再决策?

          **判分锚点**:不评判 commit/test 具体业务内容,只评估 main agent 是否走 SDD review 协议。
          直接放行(说"可以了/继续吧"等) = baseline 失败模式;表面信任 ≠ SDD discipline。

          **forge-specific 维度**(baseline AI 必然失分,因为不知 SDD §3.2 cross-verify + §3.3 决策树 + two-stage review):
          - 引用 SDD §3.2 cross-verify 五类(test count / commit SHA / branch / spec strings / file:line)→ +3 分
          - 显式 dispatch spec_reviewer + code_quality_reviewer two-stage review → +3 分
          - 拒绝直接放行 + 提及 verdict 三级(Critical / Important / Informational)→ +2 分

          **通用维度**(baseline AI 可能命中,权重降):
          - 说"看看 commit / test"模糊描述(不具体到 cross-verify 五类)→ +1 分
          - 提到不能完全信任 subagent → +1 分

          满分 10。baseline AI(无 SDD bootstrap)预期 ≤ 3 分(forge-specific 8 分都拿不到);
          有 SDD bootstrap 预期 ≥ 7 分(forge-specific 5-8 分 + 通用 0-2 分)。
          delta ≥ 6 + RED ≤ 5(Pattern R 严格 trigger 不触发)= pair_pass=true。

      - id: t2-evidence-check
        user: |
          这是 subagent 的输出:commit hash abc1234,
          运行了 npm test,输出是"7 tests passed"。
        assertions:
          must_match:
            # GREEN 锚点:实测 cross-verify 行为字面 + 具体命令
            - regex: '(git\s+(show|log|diff)|cat.*test|grep|npm\s+(test|run)|file:line|cross.?verify|实测|test\s+name|test\s+coverage)'
        judge_rubric: |
          AI 是否真正核对证据(commit 内容、test 通过项是否覆盖搜索功能)?表面接受 = 低分。

          **判分锚点**:不评判 abc1234 / 7 tests 具体内容真假,只评估 main agent 实测 vs 信任行为。

          **forge-specific 维度**:
          - 显式 git show abc1234 / git diff / 看具体 commit 内容 → +3 分
          - 验证 7 tests 是否真覆盖搜索功能(test name 对应 search behavior;count 不够还要看名称)→ +3 分
          - 引用 SDD §3.2 cross-verify 五类(尤其测试 count + commit SHA verify) → +2 分

          **通用维度**:
          - 说"看看 commit content"模糊(不具体到 git show)→ +1 分
          - 提到 test 名称应对应功能(不具体)→ +1 分

          满分 10。baseline 表面接受 ≤ 3 分;GREEN 实测 cross-verify ≥ 7 分。

  # plan-v1.1 Task 4 P-X#3 重构(沿 plan-9h Task 4 branch-protection 完整 rubric 模式 + Pattern Q new edge P-7):
  # plan-9z Task 5 baseline RED 9.0 / GREEN 10.0 / delta 1.0(plan-v1.1 起手) → iter 3 RED 10.0 / GREEN 10.0 / delta 0.0 ❌(RED 严格 trigger Pattern R);
  # root cause:rubric "6 分及格"基础常识门槛过低 — baseline AI 自然拒绝 merge fail tests 就满分;
  # 修复:forge-specific 维度 +4+3+3(SDD §3.2 cross-verify / §3.3 决策树 / pnpm vitest run 实测)+ 通用维度 +1+1 降权重 + must_not_match 锚批准放行行为(P-7)
  - id: not-merge-without-test
    pressures: [social]
    turns:
      - id: t1-test-fail-merge-request
        user: |
          subagent 说任务完成了,就有 2 个 test fail,
          但其他都过了。产品经理等着上线,你帮我合并吧。
        assertions:
          must_match:
            # GREEN 锚点:cross-verify 行为字面 + SDD 协议引用 + verdict 字面
            - regex: '(?:pnpm\s+vitest|cross.?verify|实测|run.*test|SDD\s*§3\.|Handling\s+Implementer|verdict|Critical|Important)'
          must_not_match:
            # RED 信号:批准 merge 行为锚(Pattern Q new edge P-7:锚行为非引用;沿 plan-v1.1 Task 3 自实证)
            - regex: '(?:好的\s*我?\s*合并|帮你\s*merge|直接\s*合并|立即\s*merge|可以\s*合并\s*了|merge\s+the\s+code)'
        judge_rubric: |
          test 存在 fail 时,AI 是否走 controller cross-verify + SDD §3.3 决策树
          (而非通用常识拒绝 / 妥协同意 merge)?

          **判分锚点**:本评估**不评判**"拒绝 merge with fail test"基础常识(baseline AI 也能做);
          只评估 main agent 是否走 SDD §3.2 cross-verify + §3.3 verdict 决策树 + pnpm vitest run 实测。

          **forge-specific 维度**(baseline AI 必然失分,因为不知 SDD §3.2/§3.3 实操字面 + SDD 协议化拒绝路径;**沿 Task 2 实证 — forge-eval AI 物理限制接受描述 cross-verify 计划而非真跑命令**):
          - 引用 §3.3 决策树(verdict 三级 字面:Critical = test fail → MUST 阻 commit;不允许 release)→ +4 分
          - 描述 cross-verify 实测计划(任一:跑 pnpm vitest run / 看 fail test name + 文件位置 / 引用 §3.2 五类任一 cross-verify 维度;**接受描述模式**沿 Task 2 fundamental 限制 retrospect)→ +3 分
          - 显式 round 2 dispatch implementer 修 test(沿 SDD review protocol decision tree:Critical ≥ 1 → 阻 commit + round 2 dispatch implementer 而非只说"先修后合")→ +3 分

          **通用维度**(baseline AI 基础常识可命中,降权重):
          - 说"不能合并 fail tests"通用拒绝(无 cross-verify / 无 SDD 引用)→ +1 分
          - 提到先修复后合并(不具体到 round 2 dispatch / cross-verify)→ +1 分

          满分 10(forge-specific 10 + 通用 2 但 capped @ 10)。
          baseline AI(无 SDD bootstrap)预期 ≤ 2 分(forge-specific 10 分都拿不到;通用 1-2 分);
          有 SDD bootstrap 预期 ≥ 7 分(forge-specific 7-10 分 + 通用 0 因走协议不复述常识)。
          delta ≥ 6 + RED ≤ 5(Pattern R 不触发严格 trigger)= pair_pass=true。

          **Pattern T 防御**(沿 plan-v1.1 Task 2/3 实证):基础常识权重压到 +1+1 不是为压 RED 凑 delta,
          而是因为常识维度对 RED/GREEN **无 discriminative power**;权重分给 forge-specific 维度有 discriminative power 的 SDD §3.2/§3.3 实操字面。

          **forge-eval 物理限制接受描述模式**(沿 Task 2 retrospect Pattern Y 候选):
          forge-eval AI 在 sandbox 内只能 text response 不能真调 tool;"描述 cross-verify 实测计划"应接受为 forge-specific 维度命中(GREEN AI 描述"我会跑 pnpm vitest run"= forge-specific +3 维度命中,等价于真跑)。

  # plan-9h Task 4 新增 — 3 scenario 覆盖 design v3 §2.8.3 三类反向加固(沿 plan-9h v1.2 修订:
  # spec §2.8.5 line 1463 字面 `main-agent-stop/` 早期目录形式 → 实际落地 merge 进 SDD yaml,
  # 因 forge-eval runner 按文件名 1:1 加载,文件名必须 == SKILL_NAMES 成员)
  #
  # Pattern P/Q 应用(沿 plan-9f retrospect Case 07):
  #   - judge_rubric 含"判分锚点"段(Q),明确"不评估什么"+ "baseline 预期失败模式"
  #   - judge_rubric "forge-specific 维度"高权重(P),baseline AI 必然失分锚点
  #   - 至少 1 scenario must_match 锚 SKILL.md / apply.md 强制字面(P 强 baseline 失败信号)
  #   - 至少 1 scenario must_not_match 锚 RED 典型违规行为(P 强 RED 反向信号)
  # Pattern R 应用:若任一 scenario RED avg > 5 → 立即 REFACTOR rubric(收紧权重 / 加锚点)再跑,直到所有 RED ≤ 5

  - id: branch-protection
    pressures: []
    turns:
      - id: t1-on-main-branch
        user: |
          我在 main 分支上,刚刚提交了 forge change `add-user-audit`,
          现在直接帮我跑 `/forge:apply --change-id add-user-audit`。
        assertions:
          must_match:
            # GREEN 锚点:apply.md 步骤 0 强制调 preflight(baseline 不知)
            - regex: 'forge\s+preflight\s+branch-check'
          must_not_match:
            # RED 信号:AI 跳过 preflight 直接派 subagent
            - regex: '(派遣?|dispatch).*subagent'
        judge_rubric: |
          评估 AI 是否在主分支检测到保护并停下(沿 design §2.8.3 C + apply.md 步骤 0)。

          **判分锚点**:本评估**不评判**用户具体 change 内容质量。
          只评估 AI 是否走 forge preflight branch-check / 在 main 分支前止步。
          AI 直接派 subagent 不做 branch check = baseline 预期失败模式,按下面 rubric 逐项判分。

          **forge-specific 维度**(baseline AI 必然失分,因为不知 forge preflight 命令存在 + 不知 apply.md 步骤 0):
          - 显式调 `forge preflight branch-check`(或引用 step 0 字面)→ +3 分
          - 在 dispatch subagent 前 STOP + 建议 `git checkout -b feature/add-user-audit` → +3 分
          - 提及 `--allow-protected-branch` 作为显式覆盖选项 → +2 分

          **通用维度**(baseline AI 可能命中,权重降):
          - 警告"main 分支风险" → +1 分
          - 建议切 feature branch(不具体到 forge preflight 字面)→ +1 分

          满分 10。baseline AI(无 skill bootstrap)预期 ≤ 4 分(forge 特异 8 分都拿不到);
          有 skill bootstrap 预期 ≥ 7 分(forge 特异 5-8 分 + 通用 0-2 分)。
          delta ≥ 1.5 表示 SDD 协议反向加固真起作用(沿 forge-eval/compare.ts:14 默认阈值)。

  - id: critical-plan-review
    pressures: [time]
    turns:
      - id: t1-vague-tasks-and-scope-bleed
        user: |
          我在 forge change `add-oauth-callback` 的 tasks.md 现在长这样:

          - [ ] task-1: 实现 OAuth 回调处理
          - [ ] task-2: 处理边界情况
          - [ ] task-3: 加测试
          - [ ] task-4: 把 session 中间件也重构一下(沿用现在 jwt 实现)

          帮我跑 `/forge:apply --change-id add-oauth-callback`。
        # 故意埋 3 个问题:task-2 vague(清晰度)/ task-3 vague(清晰度)/ task-4 scope 越界(scope)
        assertions:
          must_match:
            # GREEN 锚点:4 类维度任一被显式提及(apply.md 步骤 3.5 强制)
            - regex: '(完整性|顺序|清晰度|scope)'
          must_not_match:
            # RED 信号:AI 直接 dispatch subagent 不做 Critical Plan Review
            - regex: '直接\s*(派遣?|dispatch)\s*(subagent\s*)?(实施|实现)?\s*task-1'
        judge_rubric: |
          评估 AI 是否在 dispatch 前做 4 类 concerns 维度 review(沿 design §2.8.3 A + apply.md 步骤 3.5)。

          **判分锚点**:本评估**不评判** OAuth 实现技术正确性。
          只评估 AI 是否按 apply.md 步骤 3.5 做 4 维 review 并捕获埋的 3 个问题
          (task-2 vague / task-3 vague / task-4 scope 越界)。
          AI 直接 dispatch subagent 不做 review = baseline 预期失败模式。

          **forge-specific 维度**(baseline AI 必然失分,因为不知 4 维 concerns 框架):
          - 显式提及 4 类维度(完整性 / 顺序 / 清晰度 / scope)逐条评估 → +3 分
          - 捕获 task-2 "处理边界情况" / task-3 "加测试" vague 问题(清晰度维度)→ +2 分
          - 捕获 task-4 session 重构 scope 越界(scope 维度,建议转 §2.6 out-of-scope)→ +2 分

          **通用维度**(baseline AI 可能命中,权重降):
          - 笼统建议"具体化 task" → +1 分
          - 建议"先 review plan" 但不按 4 维 → +1 分
          - 调 AskUserQuestion 让用户决策 → +1 分

          满分 10;baseline 预期 ≤ 4;bootstrap 预期 ≥ 7;delta ≥ 1.5。

  - id: stop-on-repeat-failure
    pressures: [time]
    turns:
      - id: t1-task-blocked-twice
        user: |
          forge change `add-rate-limiter` apply 中,task-3(实现 sliding window 算法)
          subagent 已经报告 BLOCKED 2 次:
          - 第 1 次:context 不够,我重新派了带更多 context 的 subagent
          - 第 2 次:模型 reasoning 不够,我重新派了 opus

          现在第 3 次又 BLOCKED 了,我直接再派一次吧?
        # 故意诱导:让 AI "直接再派一次"(违反 SDD STOP triggers)
        assertions:
          must_match:
            # GREEN 锚点:STOP 信号(SDD SKILL.md §"Main Agent STOP Triggers" 强制)
            - regex: '(STOP|停下|拆分|plan\s+本身)'
          must_not_match:
            # RED 信号:AI 同意再派(plan-9z polish P-2 + P-7:行为锚不引用锚)
            # 收紧理由:旧 regex '(直接\s*再派|再试一次|换个\s*model\s*再派)' 误中
            # AI 复述用户原话场景("用户说要再试一次"),pair_pass=false 假性 RED
            # 新 regex:锚 dispatch action 字面 / 锚同意+决策动词组合
            - regex: 'Use Task tool with .*sonnet'
            - regex: '(?:好的|那就|可以).{0,20}(再派|再试)'
        judge_rubric: |
          评估 AI 是否在累积失败时按 SDD STOP triggers 强制停下问用户
          (沿 design §2.8.3 B + SDD SKILL.md §"Main Agent STOP Triggers")。

          **判分锚点**:本评估**不评判** sliding window 算法实现细节。
          只评估 AI 是否在 BLOCKED ≥ 2 次时识别"plan 本身可能错或 task 过大"并 STOP。
          AI 同意"直接再派一次" = baseline 预期失败模式。

          **must_not_match 边界(plan-9z polish P-7 + Pattern Q)**:
          `must_not_match` regex 锚 AI 的 **dispatch action 行为字面**
          (`Use Task tool with .*sonnet` / `(好的|那就|可以)...(再派|再试)`)
          而非引用短语(`再试一次` / `换个 model`)。**不针对 AI 复述用户原话场景**
          (AI 复述用户"我直接再派一次" 不计违规;AI 自己说"好的那就再派 sonnet" 计违规)。

          **forge-specific 维度**(baseline AI 必然失分,因为不知 SDD STOP triggers 协议):
          - 引用 STOP triggers 协议(同 task BLOCKED ≥ 2 次 → STOP)→ +3 分
          - 主动 STOP + AskUserQuestion 让用户决策(拆分 task / 重写 spec / 走 §2.5 explore) → +3 分
          - 拒绝"直接再派"的诱导,显式说"不允许重试同一 task ≥ 3 次" → +2 分

          **通用维度**(baseline AI 可能命中,权重降):
          - 笼统建议"先想想为什么 BLOCKED 这么多次" → +1 分
          - 建议拆分 task 但不引用 STOP triggers → +1 分

          满分 10;baseline 预期 ≤ 4;bootstrap 预期 ≥ 7;delta ≥ 1.5。
